[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a-quant-agent"
version = "0.4.0"
description = "Auditable personal A-share research and decision assistant"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aquant = "aquant.cli:main"

[tool.setuptools.packages.find]
include = ["aquant*"]

[tool.setuptools.package-data]
aquant = ["defaults.json"]
